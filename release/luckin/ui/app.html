<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luckin 商品与订单</title>
<script>document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';</script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color-scheme:light;--canvas:transparent;--surface:#FFFFFF;--field:#F7F7F8;--line:#E8E8EB;--text:#252529;--muted:#73757C;--brand:#0022AB;--blue:#0022AB;--soft:#F2F4FF;--price:#F95234;--error:#C33342}
:root[data-theme=dark]{color-scheme:dark;--canvas:#111111;--surface:#1C1C1C;--field:#232323;--line:#2E2E2E;--text:#F2F2F2;--muted:#8A8A8A;--blue:#8FA0FF;--soft:#182044;--price:#FF5A36;--error:#FF8290}
*{box-sizing:border-box}body{margin:0;padding:12px;background:var(--canvas);color:var(--text);font-size:13px;line-height:1.55}main{max-width:400px;margin:auto}article{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:20px;overflow-wrap:anywhere}h1,h2,p{margin:0}h1{font-size:18px;margin:6px 0}h2{font-size:15px}.muted,small{color:var(--muted);font-size:12px}.stage{font-size:12px;color:var(--blue)}.amount{font-family:"DIN Alternate","DIN Condensed",-apple-system,sans-serif;color:var(--price);font-size:24px;font-variant-numeric:tabular-nums}.total{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:16px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}button,input{font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:36px;color:var(--text);background:var(--surface)}button{cursor:pointer;font-weight:600}button.primary{background:var(--brand);border-color:var(--brand);color:white}button.danger{border-color:var(--error);color:var(--error)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.products{list-style:none;padding:0;margin:14px 0}.products li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.copy{flex:1;min-width:0}.art{display:grid;place-items:center;flex:none;width:50px;height:58px;border-radius:10px;background:var(--field);color:var(--muted);font-size:10px;overflow:hidden}.art img{width:100%;height:100%;object-fit:contain;background:white}.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:2px 0 10px;margin-top:12px}.carousel article{flex:0 0 86%;scroll-snap-align:start;padding:16px}.carousel .art{width:100%;height:140px;margin-bottom:12px}.closed{opacity:.5}.carousel-caption{display:flex;justify-content:space-between;align-items:center}.progress{display:flex;list-style:none;padding:0;gap:6px;margin:18px 0}.progress li{flex:1;font-size:10px;color:var(--muted);border-top:3px solid var(--line);padding-top:7px}.progress li.done{color:var(--blue);border-color:var(--blue)}.code{font-family:"DIN Alternate","DIN Condensed",sans-serif;font-size:46px;letter-spacing:3px;margin:8px 0}#status{font-size:12px;color:var(--muted);margin:10px 4px;overflow-wrap:anywhere}.auth p{margin:8px 0;color:var(--muted);font-size:12px}.auth p:empty{display:none}.auth form{display:flex;flex-direction:column;gap:12px;margin-top:12px}.auth-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.auth label{flex:1;min-width:0}.auth input{width:100%}[hidden]{display:none!important}@media(pointer:coarse){button,input{min-height:44px}}
</style>
</head>
<body><main id="content" aria-live="polite"><article><h1>正在连接界面…</h1><p class="muted">确认后才会提交订单。</p></article></main><p id="status" role="status"></p>
<script type="module">
/* LUCKIN_SHARED */
const content = document.getElementById("content"), status = document.getElementById("status");
let current, busy = false, expiryTimer, pollTimer, reviewCheck, displayMode = "inline";
const finite = (value) => value != null && value !== "" && Number.isFinite(Number(value));
const money = (value) => finite(value) ? `¥${Number(value).toFixed(2)}` : "待确认";
const el = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = String(text);
  return node;
};
function button(text, action, className = "") {
  const node = el("button", className, text);
  node.type = "button";
  node.onclick = async () => {
    if (node.disabled) return;
    node.disabled = true;
    status.textContent = "";
    try {
      await action();
    } catch (error) {
      status.textContent = error.message;
    } finally {
      node.disabled = false;
    }
  };
  return node;
}
function art(product) {
  const box = el("div", "art", "暂无图片");
  try {
    const url = new URL(product.imageUrl);
    if (url.protocol === "https:" && url.hostname.endsWith(".luckincoffeecdn.com")) {
      const img = el("img");
      img.alt = product.name || "商品";
      img.referrerPolicy = "no-referrer";
      img.onerror = () => box.replaceChildren(el("span", "", "暂无图片"));
      img.src = url.href;
      box.replaceChildren(img);
    }
  } catch {
  }
  return box;
}
function shell(stage, title, note) {
  const card = el("article");
  card.append(el("div", "stage", stage), el("h1", "", title));
  if (note) card.append(el("p", "muted", note));
  content.replaceChildren(card);
  return card;
}
function actions(card, ...buttons) {
  const row = el("div", "actions");
  row.append(...buttons);
  card.append(row);
}
function products(card, items) {
  const list = el("ul", "products");
  for (const item of items || []) {
    const row = el("li"), copy = el("div", "copy");
    copy.append(el("strong", "", `${item.name} × ${item.amount}`), el("p", "muted", item.options));
    row.append(art(item), copy);
    list.append(row);
  }
  card.append(list);
}
async function changeShop() {
  if (current?.reviewId) await bridge.call("invalidate_previews", { reviewId: current.reviewId });
  if (typeof window.openai?.requestModal === "function") {
    try {
      await window.openai.requestModal({ template: "__LUCKIN_STORES_URI__" });
      const local = (await bridge.call("local_state")).data;
      if (local.selectedShop) render({ kind: "selection", data: local.selectedShop });
      return;
    } catch {
    }
  }
  await bridge.openShop({ showShops: true });
  status.textContent = "已请求打开选购面板的门店条。";
}
function authCard(info) {
  clearTimers();
  current = { kind: "auth", ...info };
  const card = shell("账号连接", info.expired ? "登录已失效" : "尚未连接", "");
  const form = el("div", "auth");
  card.append(form);
  authForm(form, info, async () => {
    status.textContent = "已连接";
    if (info.retry) render(await bridge.call(info.retry.name, info.retry.args));
    else await bridge.openShop();
  });
}
bridge.onAuth = authCard;
function notice(info) {
  const card = shell("说明", info.title || "无法连接", info.message || "请检查网络后重试。");
  if (info.retry) actions(card, button("重试", async () => render(await bridge.call(info.retry.name, info.retry.args)), "primary"));
}
function carousel(result) {
  const shops = result.kind === "shops", list = (shops ? result.data : result.products) || [];
  const heading = el("div", "carousel-caption");
  heading.append(el("h2", "", shops ? "选择取餐门店" : "选一杯喜欢的"));
  if (!shops) heading.append(button("换店", changeShop));
  const track = el("div", "carousel");
  track.setAttribute("aria-label", shops ? "门店轮播" : "商品轮播");
  content.replaceChildren(heading, track);
  for (const item of list.slice(0, shops ? 5 : 8)) {
    const card = el("article", shops && item.open === false ? "closed" : "");
    if (!shops) card.append(art(item));
    card.append(el("h2", "", shops ? item.deptName : item.name));
    if (shops) {
      card.append(el("p", "muted", item.address), el("p", "muted", item.open === false ? "未营业" : item.open === true ? "营业中" : "营业状态待确认"));
      if (item.workTimeStart && item.workTimeEnd) card.append(el("p", "muted", `${item.workTimeStart}–${item.workTimeEnd}`));
      if (item.open !== false) actions(card, button("选这家", async () => {
        const selection = await bridge.call("select_shop", { deptId: item.deptId });
        render(selection);
      }, "primary"));
    } else {
      card.append(el("p", "muted", item.tags), el("p", "", `商品原价 ${money(item.price)}`));
      if (finite(item.estimatePrice)) card.append(el("p", "muted", `商品预估价 ${money(item.estimatePrice)}`));
      actions(card, button("选规格", async () => {
        await bridge.openShop({ deptId: result.deptId, productId: item.productId });
        status.textContent = "已请求打开该商品的规格面板。";
      }, "primary"));
    }
    track.append(card);
  }
  if (!list.length) track.append(el("article", "muted", shops ? "暂无门店，请调整坐标或名称。" : "暂无匹配商品，请换个搜索词。"));
}
function reviewCard(result) {
  const order = result.kind === "order", summary = result.summary || {};
  const card = shell("待确认", order ? "核对订单" : "确认取消订单", order ? "到店取 · 请核对门店、规格和金额。" : "取消后可能无法恢复。"), stage = card.querySelector(".stage");
  card.append(el("h2", "", order ? summary.shop?.name : summary.orderId), el("p", "muted", order ? summary.shop?.address : `${summary.status} · ${summary.shop}`));
  if (order) {
    products(card, summary.products);
    const total = el("div", "total");
    total.append(el("span", "", "订单预览金额"), el("strong", "amount", money(summary.total)));
    card.append(total, el("p", "muted", "确认后创建订单；如需付款，请在瑞幸官方渠道完成。"));
  }
  const secondary = button(order ? "换店" : "保留订单", async () => {
    if (order) await changeShop();
    else {
      await bridge.call("invalidate_previews", { reviewId: result.reviewId });
      clearTimers();
      shell("已保留", "订单保持原状", "未提交取消请求。");
    }
  }, order ? "" : "primary");
  const confirm = button(order ? "确认创建订单" : "确认取消", async () => {
    if (busy || current !== result) return;
    busy = true;
    clearTimers();
    stage.textContent = "提交中";
    secondary.disabled = true;
    confirm.disabled = true;
    try {
      const next = await bridge.call(order ? "confirm_order" : "confirm_cancel", { reviewId: result.reviewId });
      busy = false;
      render(next);
    } catch (error) {
      busy = false;
      if (error.result?.kind !== "auth") notice({ title: "提交结果待核实", message: `${error.message} 请先查询订单状态，避免重复提交。` });
    } finally {
      busy = false;
    }
  }, order ? "primary" : "danger");
  actions(card, ...(order ? [secondary, confirm] : [confirm, secondary]));
  function expire() {
    clearInterval(expiryTimer);
    clearInterval(reviewCheck);
    stage.textContent = "已失效 → 重新预览";
    confirm.disabled = false;
    confirm.textContent = "重新预览";
    confirm.className = "primary";
    secondary.className = "";
    card.querySelector(".actions").replaceChildren(secondary, confirm);
    confirm.onclick = async () => {
      if (confirm.disabled) return;
      confirm.disabled = true;
      try {
        render(await bridge.call(order ? "review_order" : "review_cancel", result.input));
      } catch (error) {
        status.textContent = error.message;
      } finally {
        confirm.disabled = false;
      }
    };
  }
  const expiresAt = result.expiresAt ?? Date.now() + Number(result.expiresInSeconds ?? 300) * 1e3;
  function tick() {
    const seconds = Math.ceil((expiresAt - Date.now()) / 1e3);
    if (seconds <= 0) return expire();
    stage.textContent = `待确认 · ${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
  }
  expiryTimer = setInterval(tick, 1e3);
  reviewCheck = setInterval(async () => {
    try {
      if (!(await bridge.call("review_status", { reviewId: result.reviewId })).valid && current === result && !busy) expire();
    } catch {
    }
  }, 5e3);
  tick();
  if (!order) secondary.focus();
}
async function presentation(mode) {
  if (displayMode === mode) return;
  try {
    if (bridge.context.availableDisplayModes?.includes(mode)) {
      const response = await bridge.request("ui/request-display-mode", { mode });
      displayMode = response.mode;
    } else if (typeof window.openai?.requestDisplayMode === "function") {
      const response = await window.openai.requestDisplayMode({ mode });
      displayMode = response?.mode || mode;
    }
  } catch {
  }
}
function receipt(data) {
  const pickup = data.pickup, active = pickup?.visible === true;
  const card = shell(active ? "取餐状态" : data.needPay ? "待付款" : "订单状态", (active ? pickup.status : data.orderStatusName) || (data.needPay ? "订单已创建，待付款" : "状态待核实"), data.warning || "");
  if (active) {
    if (pickup.full) {
      card.append(el("p", "muted", "取餐码"), el("div", "code", pickup.code), el("p", "muted", `预计 ${new Date(pickup.aboutTime).toLocaleTimeString("zh-CN", { timeZone: "Asia/Shanghai", hour: "2-digit", minute: "2-digit" })} 可取`));
      const progress = el("ol", "progress");
      ["下单成功", "制作中", "等待取餐", "已完成"].forEach((text, index) => progress.append(el("li", index <= pickup.step ? "done" : "", text)));
      card.append(progress);
    }
    card.append(el("p", "muted", `更新于 ${new Date(pickup.updatedAt).toLocaleTimeString("zh-CN")}`));
    void presentation("pip");
  } else {
    void presentation("inline");
    if (data.shopInfo?.deptName) card.append(el("h2", "", data.shopInfo.deptName));
    card.append(el("p", "muted", `订单号：${data.orderId || "未返回，请在瑞幸官方渠道核实"}`));
    if (finite(data.total)) {
      const total = el("div", "total");
      total.append(el("span", "", data.needPay ? "待支付金额" : "订单金额"), el("strong", "amount", money(data.total)));
      card.append(total);
    }
    if (data.needPay) card.append(el("p", "muted", "尚未付款，支付时限请以瑞幸官方页面为准。"));
  }
  const refresh = button("刷新状态", async () => refreshOrder(data.orderId));
  refresh.disabled = !data.orderId;
  const buttons = [refresh];
  if (data.needPay && data.payOrderUrl) buttons.push(button("去瑞幸付款 ↗", () => bridge.openLink(data.payOrderUrl), "primary"));
  actions(card, ...buttons);
  if (active && data.orderId) pollTimer = setTimeout(() => refreshOrder(data.orderId), 45e3);
}
async function refreshOrder(orderId) {
  clearTimeout(pollTimer);
  try {
    render(await bridge.call("order_detail", { orderId }));
  } catch (error) {
    status.textContent = error.message;
    if (current?.data?.pickup?.visible) pollTimer = setTimeout(() => refreshOrder(orderId), 45e3);
  }
}
function clearTimers() {
  clearInterval(expiryTimer);
  clearInterval(reviewCheck);
  clearTimeout(pollTimer);
}
function render(result) {
  if (!result || busy) return;
  clearTimers();
  current = result;
  status.textContent = "";
  if (result.kind === "auth") return authCard(result);
  if (result.kind === "notice") return notice(result);
  if (["shops", "catalog"].includes(result.kind)) return carousel(result);
  if (["order", "cancel"].includes(result.kind)) return reviewCard(result);
  if (result.kind === "receipt") return receipt(result.data || {});
  if (result.kind === "product") return carousel({ kind: "catalog", deptId: result.deptId, products: [{ productId: result.data.productId, name: result.data.productName, imageUrl: result.data.pictureUrl, price: result.data.initialPrice, estimatePrice: result.data.estimatePrice }] });
  if (result.kind === "selection") {
    const card = shell("已选门店", result.data.deptName, result.data.address);
    actions(card, button("换店", changeShop), button("选商品", () => bridge.openShop({ deptId: result.data.deptId }), "primary"));
  }
}
bridge.onResult = render;
new ResizeObserver(() => {
  window.parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/size-changed", params: { height: Math.ceil(document.body.getBoundingClientRect().height) } }, "*");
}).observe(document.body);
window.addEventListener("pagehide", clearTimers);
if (!await bridge.ready) notice({ title: "客户端不支持确认界面", message: "请在支持 MCP Apps 的客户端中打开；模型不能代为确认创建或取消订单。" });
</script></body></html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luckin 商品与订单</title>
  <script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
  <style>
:root {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Segoe UI",
    sans-serif;
  color-scheme: light;
  --canvas: #f5f5f5;
  --surface: #fff;
  --field: #f7f7f7;
  --text: #262626;
  --muted: #737373;
  --line: #e6e6e6;
  --brand: #232773;
  --brand-hover: #191e65;
  --error: #b42331;
  --success: #176b46;
  --price: #d74620;
  --soft: #f1f2fc;
  --selected: #232773;
  background: var(--canvas);
  color: var(--text);
}
:root[data-theme=dark] {
  color-scheme: dark;
  --canvas: #101113;
  --surface: #1b1c1f;
  --field: #242529;
  --text: #f4f4f4;
  --muted: #aaaeb5;
  --line: #393a3e;
  --error: #ffa7ad;
  --success: #9bd2ae;
  --price: #ff956e;
  --soft: #23263b;
  --selected: #c1c8ff;
}
* {
  box-sizing: border-box;
}
html,
body {
  min-height: 100%;
}
body {
  margin: 0;
  padding: 12px;
  background: var(--canvas);
  color: var(--text);
  font-size: 13px;
  line-height: 1.45;
}
main {
  width: min(100%, 400px);
  margin: auto;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
}
header {
  padding: 18px 20px 16px;
  border-bottom: 1px solid var(--line);
}
.brand-logo {
  display: block;
  width: 100px;
  height: 28px;
  margin-bottom: 12px;
  object-fit: contain;
  object-position: left center;
}
.brand-logo-dark {
  display: none;
}
:root[data-theme=dark] .brand-logo-light {
  display: none;
}
:root[data-theme=dark] .brand-logo-dark {
  display: block;
}
.eyebrow {
  margin: 0 0 7px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
}
h1 {
  margin: 0;
  color: var(--text);
  font-size: 18px;
  line-height: 1.3;
}
.intro {
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.55;
}
section {
  padding: 16px 20px 3px;
}
.label {
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}
.shop {
  font-size: 14px;
  font-weight: 700;
}
.address {
  margin-top: 5px;
  color: var(--muted);
  font-size: 12px;
}
ul {
  list-style: none;
  padding: 0;
  margin: 0;
}
li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
li:last-child {
  border: 0;
}
.product-art {
  display: grid;
  place-items: center;
  flex: 0 0 48px;
  width: 48px;
  height: 56px;
  overflow: hidden;
  border-radius: 8px;
  background: var(--field);
  color: var(--muted);
  font-size: 10px;
}
.product-art img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.product-description {
  min-width: 0;
  flex: 1;
}
.product-name {
  font-size: 13px;
  font-weight: 700;
  line-height: 1.35;
}
.options {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
}
.amount {
  align-self: center;
  white-space: nowrap;
  font-weight: 700;
}
.total {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin-top: 12px;
  padding: 12px 20px;
  background: var(--field);
  font-size: 13px;
}
.total strong {
  color: var(--price);
  font-size: 20px;
  white-space: nowrap;
}
.note {
  margin: 14px 20px 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.55;
}
.actions {
  display: flex;
  gap: 8px;
  padding: 15px 20px 18px;
}
button {
  min-height: 38px;
  padding: 8px 13px;
  border: 1px solid var(--line);
  border-radius: 7px;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
button.secondary {
  background: var(--surface);
  color: var(--brand);
}
:root[data-theme=dark] button.secondary {
  color: var(--text);
}
button.primary {
  flex: 1;
  border-color: var(--brand);
  background: var(--brand);
  color: #fff;
}
button.primary:hover:not(:disabled) {
  border-color: var(--brand-hover);
  background: var(--brand-hover);
}
button:disabled {
  opacity: .55;
  cursor: default;
}
button:focus-visible {
  outline: 2px solid #4656b5;
  outline-offset: 2px;
}
#status {
  min-height: 1.5em;
  margin: 0 20px 16px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}
#status[data-tone=error] {
  color: var(--error);
}
#status[data-tone=success] {
  color: var(--success);
}
[hidden] {
  display: none !important;
}
@media (pointer: coarse) {
  button {
    min-height: 44px;
  }
}
.stage {
  display: inline-block;
  margin: 0 0 9px;
  padding: 3px 7px;
  border-radius: 5px;
  background: var(--soft);
  color: var(--selected);
  font-size: 11px;
}
.stage.pending {
  color: var(--price);
  background: var(--field);
}
.product-art:has(img) {
  background: #fff;
}
.amount {
  text-align: right;
}
.amount small {
  display: block;
  font-size: 11px;
  color: var(--muted);
  font-weight: 400;
  margin-top: 4px;
}
#receipt {
  margin: 12px 20px 16px;
}
#order-number {
  overflow-wrap: anywhere;
  color: var(--muted);
  font-size: 11px;
  margin-bottom: 10px;
}
</style>
</head>
<body>
  <main>
    <header>
      <img class="brand-logo brand-logo-light" src="https://s2.luckincoffeecdn.com/luckyweb/public/assets/82fc225c29de0a222f9dcc6844ecd2d1.png" alt="luckin coffee">
      <img class="brand-logo brand-logo-dark" src="https://web.luckincdn.com/default/assets/logo2-9d412147.svg" alt="luckin coffee">
      <div class="stage" id="stage">等待订单预览</div>
      <h1 id="title">等待订单预览</h1>
      <p class="intro" id="intro">请核对实时返回的信息，确认后才会向瑞幸提交。</p>
    </header>
    <section id="shop-section">
      <div class="label" id="section-label">门店</div>
      <div class="shop" id="shop">—</div>
      <div class="address" id="address"></div>
    </section>
    <section id="products-section" hidden>
      <div class="label" id="products-label">商品</div>
      <ul id="products"></ul>
    </section>
    <div class="total" id="total-row" hidden><span id="total-label">订单预览金额</span><strong id="total">—</strong></div>
    <p class="note" id="note">确认有效期 5 分钟。最终金额和状态以瑞幸官方结果为准。</p>
    <div class="actions" id="actions">
      <button class="secondary" id="dismiss" type="button">暂不操作</button>
      <button class="primary" id="confirm" type="button" disabled>确认</button>
    </div>
    <div id="receipt" hidden><p id="order-number"></p><button class="secondary" id="refresh" type="button">刷新状态</button></div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script type="module">

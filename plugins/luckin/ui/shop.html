<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luckin</title>
  <script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
  <style>
:root {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
  font-synthesis: none;
  color-scheme: light;
  --canvas:#f5f5f5;
  --surface:#fff;
  --field:#f7f7f8;
  --text:#252529;
  --muted:#73757c;
  --line:#e8e8eb;
  --brand:#0022AB;
  --brand-hover:#001B88;
  --brand-soft:#F2F4FF;
  --selected:#0022AB;
  --selected-line:#0022AB;
  --price:#F95234;
  --focus:#6573cc;
  --error:#b42331;
  --success:#26714e;
  background: var(--canvas);
  color: var(--text);
}
:root[data-theme=dark] {
  color-scheme: dark;
  --canvas:#111111;
  --surface:#1C1C1C;
  --field:#232323;
  --text:#F2F2F2;
  --muted:#8A8A8A;
  --line:#2E2E2E;
  --brand-soft:#182044;
  --selected:#8FA0FF;
  --selected-line:#4A63F0;
  --price:#FF5A36;
  --focus:#adb6ff;
  --error:#ffadb5;
  --success:#a0d8b9;
}
* {
  box-sizing: border-box;
}
html,
body {
  min-height: 100%;
}
body {
  margin: 0;
  background: var(--canvas);
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
}
button,
input {
  font: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: .5;
}
button:focus-visible,
input:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}
img {
  display: block;
  max-width: 100%;
}
[hidden] {
  display: none !important;
}
h1,
h2,
h3,
p {
  margin: 0;
}
button {
  color: inherit;
}
input {
  min-width: 0;
  min-height: 36px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--field);
  color: var(--text);
  outline: 0;
}
input::placeholder {
  color: var(--muted);
  opacity: 1;
}
.main {
  display: grid;
  grid-template-columns: minmax(260px, .95fr) minmax(330px, 1.3fr) minmax(280px, .95fr);
  width: min(100%, 1460px);
  min-height: 100dvh;
  margin: auto;
  background: var(--surface);
}
.column {
  min-width: 0;
  padding: 20px 20px 88px;
}
.catalog-column,
.cart-column {
  background: var(--canvas);
}
.column + .column {
  border-left: 1px solid var(--line);
}
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 16px;
}
.section-head h1,
.section-head h2 {
  font-size: 16px;
  line-height: 1.4;
  letter-spacing: -.02em;
}
.count,
.muted,
.hint {
  color: var(--muted);
  font-size: 12px;
}
.hint {
  margin: 9px 0 16px;
}
.mode {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 7px;
  border-radius: 5px;
  background: var(--brand-soft);
  color: var(--selected);
  font-size: 11px;
  font-weight: 600;
}
.icon {
  width: 18px;
  height: 18px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.store-button {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 12px;
  margin-bottom: 14px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
}
.store-button > .icon {
  color: var(--selected);
}
.store-button-copy {
  display: grid;
  gap: 3px;
  min-width: 0;
  flex: 1;
}
.store-button-label {
  color: var(--muted);
  font-size: 11px;
}
.store-button-value {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 600;
}
.store-chevron {
  width: 6px;
  height: 6px;
  border-top: 1.5px solid var(--muted);
  border-right: 1.5px solid var(--muted);
  transform: rotate(45deg);
}
.search-row,
.order-lookup .row {
  display: flex;
  gap: 7px;
}
.search-row input,
.order-lookup input {
  width: 100%;
  flex: 1;
}
.primary,
.secondary,
.link-button {
  min-height: 36px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.4;
  white-space: nowrap;
}
.primary {
  border-color: var(--brand);
  background: var(--brand);
  color: white;
}
.primary:hover:not(:disabled) {
  background: var(--brand-hover);
}
.primary:disabled {
  opacity: 1;
  background: var(--field);
  border-color: var(--line);
  color: var(--muted);
}
.secondary {
  background: var(--surface);
  color: var(--text);
}
.secondary:hover:not(:disabled),
.store-button:hover {
  border-color: var(--selected-line);
}
.link-button {
  padding: 3px 0;
  min-height: 24px;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 11px;
}
.link-button:hover {
  color: var(--text);
}
.result-caption {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin: 16px 0 8px;
  font-size: 11px;
  color: var(--muted);
}
.result-list {
  display: grid;
  gap: 2px;
  padding: 4px 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
}
.result-list:has(.empty) {
  padding: 0;
  border: 0;
  background: none;
}
.product {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 12px 0;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  text-align: left;
}
.product:last-child {
  border-bottom: 0;
}
.product.active .name {
  color: var(--selected);
}
.product .art {
  width: 64px;
  height: 72px;
  flex: none;
}
.art,
.detail-art,
.cart-art,
.review-art {
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: 10px;
  background: var(--field);
  color: var(--muted);
}
.art:has(img),
.detail-art:has(img),
.cart-art:has(img),
.review-art:has(img) {
  background: #fff;
}
.art img,
.detail-art img,
.cart-art img,
.review-art img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.product .copy {
  min-width: 0;
  flex: 1;
}
.product .name {
  display: block;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.4;
}
.product .tags {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin: 3px 0 6px;
  color: var(--muted);
  font-size: 11px;
}
.price-line {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 4px 6px;
}
.price {
  color: var(--price);
  font-size: 16px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.price-label,
del {
  color: var(--muted);
  font-size: 10px;
  font-weight: 400;
}
.product .choose {
  width: 25px;
  height: 25px;
  display: grid;
  place-items: center;
  flex: none;
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--selected);
}
.product:hover .choose,
.product.active .choose {
  background: var(--brand);
  border-color: var(--brand);
  color: white;
}
.empty {
  padding: 20px 4px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}
.detail-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 300px;
  padding: 36px 20px;
  text-align: center;
  color: var(--muted);
}
.detail-empty .icon {
  width: 42px;
  height: 42px;
  margin-bottom: 18px;
  color: var(--selected);
  stroke-width: 1;
}
.detail-empty h3 {
  color: var(--text);
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 7px;
}
.detail-empty p {
  font-size: 12px;
  max-width: 230px;
}
.detail-top {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 20px;
}
.detail-art {
  width: 124px;
  height: 140px;
  flex: none;
}
.detail-copy {
  min-width: 0;
  flex: 1;
}
.detail-copy h2 {
  font-size: 18px;
  line-height: 1.35;
  margin-bottom: 6px;
}
.detail-meta {
  margin-bottom: 12px;
  color: var(--muted);
  font-size: 11px;
}
.detail-copy .price {
  font-size: 20px;
}
.attributes {
  display: grid;
  gap: 17px;
  max-height: none;
  overflow: visible;
  scrollbar-width: thin;
  padding: 2px 3px 3px;
}
.attribute h3 {
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 7px;
}
.choices {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.choice {
  position: relative;
  min-width: 76px;
  min-height: 34px;
  padding: 7px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  font-size: 12px;
  line-height: 1.4;
}
.choice.active {
  border-color: var(--selected-line);
  background: var(--brand-soft);
  color: var(--selected);
  font-weight: 600;
}
.choice.active:after {
  content: "";
  position: absolute;
  right: 4px;
  bottom: 4px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: currentColor;
}
.choice[data-unavailable="true"] {
  background: var(--field);
  text-decoration: line-through;
}
.selected-summary {
  margin-top: 18px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  font-size: 11px;
  line-height: 1.7;
  color: var(--muted);
}
.selected-summary strong {
  color: var(--text);
  font-weight: 500;
}
.detail-bottom {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  margin-top: 14px;
}
.detail-bottom .primary {
  min-width: 120px;
}
.stepper {
  display: flex;
  gap: 7px;
  align-items: center;
}
.stepper button {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  font-size: 17px;
  line-height: 1;
}
.stepper button:last-child {
  color: white;
  background: var(--brand);
  border-color: var(--brand);
}
.stepper span {
  min-width: 18px;
  text-align: center;
  font-variant-numeric: tabular-nums;
  font-size: 12px;
}
.cart-card {
  padding: 0 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
}
.cart-store {
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  font-weight: 600;
}
.cart-store small {
  display: block;
  font-size: 11px;
  font-weight: 400;
  color: var(--muted);
  margin-top: 3px;
}
.cart-empty {
  padding: 24px 0;
  color: var(--muted);
  font-size: 12px;
}
.cart-item {
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr);
  gap: 10px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.cart-art {
  width: 46px;
  height: 54px;
}
.cart-copy {
  min-width: 0;
}
.cart-item strong {
  display: block;
  font-size: 12px;
  font-weight: 600;
}
.cart-item p {
  margin: 3px 0 10px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.6;
}
.cart-item .row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
}
.cart-item .stepper button {
  width: 24px;
  height: 24px;
  font-size: 15px;
}
.cart-item .stepper {
  gap: 4px;
}
.cart-total {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  padding: 14px 0 10px;
  font-size: 12px;
}
.cart-total strong {
  font-size: 20px;
  color: var(--price);
  font-variant-numeric: tabular-nums;
}
.cart-note {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.6;
  padding-bottom: 14px;
}
.cart-actions {
  margin-top: 12px;
}
.cart-actions button {
  width: 100%;
}
.status {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
  margin-top: 9px;
  overflow-wrap: anywhere;
}
.status:empty {
  display: none;
}
.status.error {
  color: var(--error);
}
.status.success {
  color: var(--success);
}
.order-lookup {
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}
.order-lookup h3 {
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 10px;
}
.preview {
  margin-top: 16px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  overflow-wrap: anywhere;
}
.preview h3 {
  font-size: 14px;
  margin-bottom: 9px;
}
.preview p {
  font-size: 11px;
  color: var(--muted);
  margin: 4px 0;
}
.preview .line {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin: 9px 0;
  font-size: 12px;
}
.preview .total {
  border-top: 1px solid var(--line);
  padding-top: 10px;
  font-weight: 600;
}
.preview .total strong {
  color: var(--price);
  font-size: 18px;
}
.preview .actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  flex-wrap: wrap;
}
.preview .actions .primary {
  flex: 1;
}
.review-item {
  display: flex;
  gap: 9px;
  align-items: center;
  margin: 12px 0;
}
.review-art {
  width: 42px;
  height: 48px;
  flex: none;
}
.review-item .copy {
  flex: 1;
  min-width: 0;
  font-size: 12px;
}
.review-item .copy small {
  display: block;
  color: var(--muted);
  font-size: 11px;
}
.review-item > span {
  font-size: 12px;
  white-space: nowrap;
}
.order-state {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  font-size: 11px;
  color: var(--selected);
  background: var(--brand-soft);
  border-radius: 5px;
  padding: 3px 7px;
  margin-bottom: 9px;
}
.order-state:before {
  content: "";
  width: 5px;
  height: 5px;
  background: currentColor;
  border-radius: 50%;
}
.order-state.pending {
  color: var(--price);
  background: var(--field);
}
.order-number {
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.dialog { margin: 0 0 16px; }
.dialog-card { padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.dialog-card h2 {
  font-size: 16px;
  margin-bottom: 6px;
}
.dialog-card label {
  display: block;
  margin: 13px 0 5px;
  font-size: 12px;
}
.dialog-card input {
  width: 100%;
}
.coordinate {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 16px;
}
.shop-list {
  display: grid;
  gap: 8px;
  margin-top: 10px;
}
.shop-option {
  display: block;
  width: 100%;
  padding: 12px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
}
.shop-option strong {
  display: block;
  font-size: 13px;
}
.shop-option span {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
}
.shop-option:hover {
  border-color: var(--selected-line);
}
.panel-tabs {
  display: none;
}
@media (min-width: 960px) and (max-width: 1150px) {
  .column {
    padding: 18px 14px 88px;
  }
  .main {
    grid-template-columns: 270px minmax(320px, 1fr) 280px;
  }
  .detail-art {
    width: 104px;
    height: 124px;
  }
  .detail-top {
    gap: 12px;
  }
  .detail-copy h2 {
    font-size: 16px;
  }
}
@media (max-width: 959px) {
  .panel-tabs {
    display: flex;
    position: sticky;
    top: 0;
    z-index: 2;
    gap: 4px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .panel-tabs button {
    flex: 1;
    min-height: 34px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
  }
  .panel-tabs button[aria-pressed=true] {
    background: var(--brand-soft);
    color: var(--selected);
    font-weight: 600;
  }
  .main {
    display: block;
    min-height: calc(100dvh - 55px);
    max-width: 640px;
  }
  .column {
    display: none;
    padding: 18px 18px 80px;
    border: 0 !important;
    min-height: calc(100dvh - 55px);
  }
  .column[data-active=true] {
    display: block;
  }
  .attributes {
    max-height: none;
    overflow: visible;
    padding: 0;
  }
  .detail-bottom {
    position: sticky;
    bottom: 0;
    padding: 14px 0;
    background: var(--surface);
  }
  .cart-column {
    background: var(--canvas);
  }
  .detail-empty {
    min-height: 280px;
  }
}
@media (pointer: coarse) {
  .primary,
  .secondary,
  .choice,
  input,
  .panel-tabs button {
    min-height: 44px;
  }
  .stepper button,
  .cart-item .stepper button {
    width: 44px;
    height: 44px;
  }
  .product {
    min-height: 88px;
  }
}
@media (max-width: 359px) {
  .coordinate {
    grid-template-columns: 1fr;
    gap: 0;
  }
  .detail-art {
    width: 96px;
    height: 112px;
  }
  .detail-top {
    gap: 12px;
  }
  .detail-copy h2 {
    font-size: 16px;
  }
  .cart-item {
    grid-template-columns: 38px minmax(0, 1fr);
  }
  .cart-art {
    width: 38px;
  }
}
.price,.cart-total strong,.preview .total strong{font-family:"DIN Alternate","DIN Condensed",-apple-system,sans-serif}
.auth-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:8px 20px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.auth-bar p{min-width:0}.auth-bar .link-button{flex:none;color:var(--selected);font-size:12px}.auth-bar [data-expired=true]{color:var(--error)}
.auth-card{width:calc(100% - 40px);max-width:400px;margin:16px 20px;border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--surface);font-size:13px}
.auth-card strong{font-size:15px}.auth-card p{margin:8px 0;color:var(--muted);font-size:12px}.auth-card p:empty{display:none}.auth-card form{display:flex;flex-direction:column;gap:14px;margin-top:14px}.auth-card label{min-width:0}.auth-card input{width:100%}.auth-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#catalog-controls[inert]{opacity:.45}.recent-terms{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.recent-terms button{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:5px 9px;color:var(--muted);font-size:11px}
